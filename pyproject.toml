[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmbot"
version = "1.0.0"
description = "Polymarket 5-minute crypto up/down trading bot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "aiohttp>=3.9",
  "websockets>=12.0",
  "httpx[http2]>=0.27",
  "certifi>=2024.2.2",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
  "textual>=0.60",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.3", "xgboost>=2.0", "joblib>=1.3"]
live = ["py-clob-client>=0.34"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.4"]
all = [
  "lightgbm>=4.3", "xgboost>=2.0", "joblib>=1.3",
  "py-clob-client>=0.34",
  "pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.4",
]

[project.scripts]
bot = "pmbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The web dashboard's page, served by `bot web`.
"pmbot.dashboard" = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
]
markers = [
  "slow: takes more than a few seconds",
  "network: needs outbound network access (skipped by default)",
]

[tool.ruff]
line-length = 96
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RET", "ARG"]
ignore = [
  "E501",    # line length is handled by the formatter, not the linter
  "B008",    # typer/pydantic use callables in defaults by design
  "SIM108",  # a ternary is not always clearer than an if
  "RET504",  # a named return value often documents what is returned
  "ARG002",  # ABC implementations legitimately ignore some arguments
  "UP042",   # `str, Enum` is deliberate: StrEnum changes __str__ behaviour
  "B905",    # remaining zips pair table headers with rows of known equal length
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "B011", "SIM115", "B007", "C408"]
"src/pmbot/dashboard/render.py" = ["C408"]  # dict() reads better in table specs
"scripts/*" = ["C408"]
